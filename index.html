/* ── Helpers ── */
const fmtDate = iso => !iso?"Never":new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const initials = name => name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();

function GIcon({g,size=40}){
  return <div style={{width:size,height:size,borderRadius:size*0.25,background:g?.gradient||"var(--card2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.28,fontWeight:700,color:"#fff",flexShrink:0}}>{g?.abbr}</div>;
}
function PIcon({p,size=14}){
  const m=PLATS.find(x=>x.id===p);
  return <span style={{fontSize:size,color:m?.color}}>{m?.icon}</span>;
}
function StatusBadge({status}){
  const map={ready:["b-gr","Ready"],generating:["b-ye","Generating"],pending:["b-gy","Pending"],failed:["b-re","Failed"],posted:["b-gr","Posted"],uploading:["b-ye","Uploading"]};
  const [c,l]=map[status]||["b-gy",status];
  return <span className={`badge ${c}`}>{l}</span>;
}
function Spinner({size=16}){return <div className="spin" style={{width:size,height:size}}/>;}
function StepBar({step,total}){
  return <div className="step-bar">{Array.from({length:total},(_,i)=>i+1).map((s,i)=>(
    <span key={s} style={{display:"contents"}}>
      <div className={`step-dot ${step>s?"done":step===s?"active":""}`}>{step>s?"✓":s}</div>
      {i<total-1&&<div className={`step-line ${step>s+1?"done":""}`}/>}
    </span>
  ))}</div>;
}

/* ── Confirm Modal ── */
function Confirm({title,msg,label="Delete",onOk,onCancel}){
  return <div className="modal-bg" onClick={onCancel}>
    <div className="modal" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
      <p className="modal-title">{title}</p>
      <p className="modal-sub">{msg}</p>
      <div className="fg g3 je"><button className="btn btn-o btn-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-d btn-sm" onClick={onOk}>{label}</button></div>
    </div>
  </div>;
}

/* ── Toast ── */
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);},[]);
  const clr=type==="success"?"#6ee7b7":type==="error"?"#fca5a5":"#c4b5fd";
  return <div className={`toast ${type}`}><span style={{color:clr,fontWeight:700}}>{type==="success"?"✓":type==="error"?"✕":"i"}</span>{msg}</div>;
}

/* ══ AUTH ══ */
function AuthPage({onLogin}){

  const [name,setName]=useState("");

    const e={};
    if(!email.trim()||!email.includes("@")) e.email="Enter a valid email address";
    if(pass.length<6) e.pass="Password must be at least 6 characters";
    if(tab==="register"&&!name.trim()) e.name="Enter your name";
    setErrs(e); return !Object.keys(e).length;
  };
  const submit=()=>{if(!validate())return;setLoading(true);setTimeout(()=>{setLoading(false);onLogin();},900);};

  return <div className="auth-page"><div className="auth-card">
    <div className="auth-logo">

    </div>
    <button className="social-btn" onClick={submit}><span style={{fontWeight:800,fontSize:15,color:"#4285f4"}}>G</span>Continue with Google</button>
    <button className="social-btn" onClick={submit}><span style={{fontWeight:700,fontSize:12,background:"var(--fg)",color:"var(--bg)",padding:"2px 5px",borderRadius:3}}>gh</span>Continue with GitHub</button>
    <div className="or-div">or</div>
    {tab==="register"&&<div className="form-group">
      <label className="form-label">Full Name</label>
      <input className={`form-input ${errs.name?"err":""}`} placeholder="Your name" value={name} onChange={e=>{setName(e.target.value);setErrs(p=>({...p,name:""}));}}/>
      {errs.name&&<p className="form-err">{errs.name}</p>}

      {errs.pass&&<p className="form-err">{errs.pass}</p>}

function NewSchedule({setSchedules,onToast,setPage}){
  const [step,setStep]=useState(1);

      <div className="form-group"><label className="form-label">Schedule Name</label><input className="form-input" value={name} onChange={e=>setName(e.target.value)} maxLength={60}/></div>
      <div className="form-group"><label className="form-label">Genre</label>
        <div className="sel-grid">{GENRES.map(g=>(
          <button key={g.id} className={`sel-item ${genre===g.id?"sel":""}`} onClick={()=>setGenre(g.id)}>
            <div style={{width:32,height:32,borderRadius:8,background:g.gradient,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",marginBottom:8}}>{g.abbr}</div>
            <div className="sel-label">{g.label}</div>
          </button>
        ))}</div></div>
      <div className="form-group"><label className="form-label">Tone</label><div className="chips">{TONES.map(t=><span key={t} className={`chip ${tone===t?"sel":""}`} onClick={()=>setTone(t)}>{t}</span>)}</div></div>
      <button className="btn btn-p btn-fw btn-lg" onClick={()=>setStep(2)}>Next: Avatar & Voice →</button>
    </>}
    {step===2&&<>
      <div className="form-group"><label className="form-label">Avatar</label>
        <div className="sel-grid">{AVATARS.map(a=>(
          <button key={a.id} className={`sel-item ${avatar===a.id?"sel":""}`} onClick={()=>setAvatar(a.id)}>
            <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,var(--accent),var(--primary2))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",marginBottom:8}}>{a.ini}</div>
            <div className="sel-label">{a.label}</div><div className="sel-sub">{a.desc}</div>
          </button>
        ))}</div></div>
      <div className="form-group"><label className="form-label">Voice</label>
        <select className="form-select" value={voice} onChange={e=>setVoice(e.target.value)}>{VOICES.map(v=><option key={v.id} value={v.id}>{v.label}</option>)}</select></div>
      <div className="form-group"><label className="form-label">Daily Post Time</label>
        <input className="form-input" type="time" value={postTime} onChange={e=>setPostTime(e.target.value)} style={{width:160}}/></div>
      <div className="form-group"><label className="form-label">Content Mode</label>
        <div className="tabs">
          <button className={`tab ${mode==="ai"?"active":""}`} onClick={()=>setMode("ai")}>AI (auto-generate topics)</button>
          <button className={`tab ${mode==="manual"?"active":""}`} onClick={()=>setMode("manual")}>Manual queue</button>
        </div>
        {mode==="manual"&&<p className="form-hint">Add topics to a queue after saving. The system picks the next unused one each day.</p>}
      </div>
      <div className="fg g3"><button className="btn btn-o btn-lg" style={{flex:1}} onClick={()=>setStep(1)}>← Back</button>
        <button className="btn btn-p btn-lg" style={{flex:2}} onClick={()=>setStep(3)}>Next: Platforms →</button></div>
    </>}
    {step===3&&<>
      <div className="form-group"><label className="form-label">Target Platforms</label>
        {PLATS.map(p=>(
          <button key={p.id} className="li" style={{marginBottom:8,...(plats.includes(p.id)?{borderColor:"var(--primary)",background:"rgba(168,85,247,0.08)"}:{})}} onClick={()=>toggleP(p.id)}>
            <span style={{fontSize:22,color:p.color}}>{p.icon}</span>
            <span style={{fontWeight:600,fontSize:14}}>{p.label}</span>
            {plats.includes(p.id)&&<span className="mla badge b-pu">✓</span>}
          </button>
        ))}</div>
      <div className="card mb4" style={{fontSize:13}}><p style={{fontWeight:700,marginBottom:10}}>Summary</p>
        {[["Name",name],["Genre",GENRES.find(g=>g.id===genre)?.label],["Tone",tone],["Time",postTime],["Mode",mode==="ai"?"AI auto-generate":"Manual queue"]]
          .map(([k,v])=><div key={k} className="fg jb" style={{padding:"6px 0",borderBottom:"1px solid var(--border)"}}><span className="tmut">{k}</span><span className="fs">{v}</span></div>)}</div>
      <div className="fg g3"><button className="btn btn-o btn-lg" style={{flex:1}} onClick={()=>setStep(2)}>← Back</button>
        <button className="btn btn-p btn-lg" style={{flex:2}} onClick={save} disabled={saving}>{saving?<Spinner size={17}/>:"✓ Create Schedule"}</button></div>
    </>}
  </div>;
}

/* ══ SCHEDULE DETAIL ══ */
function ScheduleDetail({scheduleId,schedules,setSchedules,posts,topics,setTopics,onToast,setPage}){
  const s=schedules.find(x=>x.id===scheduleId);
  const [tab,setTab]=useState("overview");
  const [edit,setEdit]=useState(false);
  const [draft,setDraft]=useState(null);
  const [newTopic,setNewTopic]=useState("");
  const [confirmDel,setConfirmDel]=useState(false);
  const [saving,setSaving]=useState(false);
  const myPosts=posts.filter(p=>p.scheduleId===scheduleId);
  const myTopics=topics.filter(t=>t.scheduleId===scheduleId);
  useEffect(()=>{if(s)setDraft({...s});},[scheduleId]);
  if(!s||!draft) return <div className="page"><p className="tmut">Schedule not found.</p></div>;
  const g=GENRES.find(x=>x.id===s.genre);
  const toggleActive=val=>setSchedules(prev=>prev.map(x=>x.id===scheduleId?{...x,isActive:val}:x));
  const saveEdit=()=>{
    if(!draft.name.trim()){onToast("Enter a name","error");return;}
    if(!draft.platforms.length){onToast("Select at least one platform","error");return;}
    setSaving(true);
    setTimeout(()=>{setSchedules(prev=>prev.map(x=>x.id===scheduleId?{...x,...draft}:x));setSaving(false);setEdit(false);onToast("Schedule updated","success");},700);
  };
  const del=()=>{setSchedules(prev=>prev.filter(x=>x.id!==scheduleId));onToast("Schedule deleted","success");setPage("automation");};
  const addTopic=()=>{if(!newTopic.trim())return;setTopics(prev=>[...prev,{id:"t"+Date.now(),scheduleId,topic:newTopic.trim(),used:false}]);setNewTopic("");onToast("Topic added","success");};
  const delTopic=id=>setTopics(prev=>prev.filter(t=>t.id!==id));
  const dg=GENRES.find(x=>x.id===draft.genre);

  return <div className="page">
    <button className="btn btn-g mb4" onClick={()=>setPage("automation")}>← Back</button>
    <div className="card-glow mb4">
      <div className="fg aic g3 mb3">
        <GIcon g={g} size={48}/>
        <div style={{flex:1}}><h1 style={{fontFamily:"var(--font-display)",fontSize:18,fontWeight:700}}>{s.name}</h1>
          <p className="tsm tmut">{g?.label} · {s.contentMode==="ai"?"AI mode":"Manual mode"} · {s.postTime}</p></div>
        <label className="switch"><input type="checkbox" checked={s.isActive} onChange={e=>toggleActive(e.target.checked)}/><span className="sw-sl"/></label>
      </div>
      <div className="fg aic g2">
        {s.platforms.map(p=><PIcon key={p} p={p} size={16}/>)}
        <span className="mla">{s.isActive?<span className="badge b-gr">Active</span>:<span className="badge b-gy">Paused</span>}</span>
      </div>
    </div>
    <div className="tabs">{["overview","topics","history"].map(t=>(
      <button key={t} className={`tab ${tab===t?"active":""}`} onClick={()=>{setTab(t);setEdit(false);}}>
        {t.charAt(0).toUpperCase()+t.slice(1)}</button>
    ))}</div>

    {tab==="overview"&&<>
      {!edit?<div className="card mb4">
        <div className="fg jb aic mb4"><h3 style={{fontWeight:700}}>Settings</h3>
          <button className="btn btn-o btn-sm" onClick={()=>setEdit(true)}>Edit</button></div>
        {[["Genre",g?.label],["Tone",s.tone],["Avatar",AVATARS.find(a=>a.id===s.avatar)?.label||s.avatar],
          ["Post Time",s.postTime],["Mode",s.contentMode==="ai"?"AI auto-generate":"Manual queue"],
          ["Last Run",s.lastRun?fmtDate(s.lastRun):"Never"]]
          .map(([k,v])=><div key={k} className="fg jb" style={{padding:"8px 0",borderBottom:"1px solid var(--border)",fontSize:13}}>
            <span className="tmut">{k}</span><span className="fs">{v}</span></div>)}
      </div>:<div className="card mb4">
        <div className="fg jb aic mb4"><h3 style={{fontWeight:700}}>Edit Settings</h3>
          <button className="btn btn-g btn-sm" onClick={()=>{setEdit(false);setDraft({...s});}}>Cancel</button></div>
        <div className="form-group"><label className="form-label">Schedule Name</label>
          <input className="form-input" value={draft.name} onChange={e=>setDraft(p=>({...p,name:e.target.value}))}/></div>
        <div className="form-group"><label className="form-label">Genre</label>
          <div className="sel-grid">{GENRES.map(g=>(
            <button key={g.id} className={`sel-item ${draft.genre===g.id?"sel":""}`} onClick={()=>setDraft(p=>({...p,genre:g.id}))}>
              <div style={{width:28,height:28,borderRadius:7,background:g.gradient,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff",marginBottom:6}}>{g.abbr}</div>
              <div className="sel-label" style={{fontSize:12}}>{g.label}</div>
            </button>
          ))}</div></div>
        <div className="form-group"><label className="form-label">Tone</label>
          <div className="chips">{TONES.map(t=><span key={t} className={`chip ${draft.tone===t?"sel":""}`} onClick={()=>setDraft(p=>({...p,tone:t}))}>{t}</span>)}</div></div>
        <div className="form-group"><label className="form-label">Post Time</label>
          <input className="form-input" type="time" value={draft.postTime} onChange={e=>setDraft(p=>({...p,postTime:e.target.value}))} style={{width:160}}/></div>
        <div className="form-group"><label className="form-label">Platforms</label>
          <div className="chips">{PLATS.map(p=>(
            <span key={p.id} className={`chip ${draft.platforms.includes(p.id)?"sel":""}`}
              style={draft.platforms.includes(p.id)?{color:p.color,borderColor:p.color+"55"}:{}}
              onClick={()=>setDraft(prev=>({...prev,platforms:prev.platforms.includes(p.id)?prev.platforms.filter(x=>x!==p.id):[...prev.platforms,p.id]}))}>
              {p.icon} {p.label.split(" ")[0]}</span>
          ))}</div></div>
        <div className="fg g3"><button className="btn btn-o" style={{flex:1}} onClick={()=>{setEdit(false);setDraft({...s});}}>Cancel</button>
          <button className="btn btn-p" style={{flex:2}} onClick={saveEdit} disabled={saving}>{saving?<Spinner size={16}/>:"Save Changes"}</button></div>
      </div>}
      <button className="btn btn-d btn-sm" onClick={()=>setConfirmDel(true)}>Delete Schedule</button>
    </>}

    {tab==="topics"&&(s.contentMode==="ai"
      ?<div className="card mb4" style={{textAlign:"center",padding:28}}>
        <div style={{width:40,height:40,borderRadius:10,background:"var(--bg3)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"var(--primary)",margin:"0 auto 12px"}}>AI</div>
        <p style={{fontWeight:600,marginBottom:6}}>AI mode is on</p>
        <p className="tsm tmut">Topics are auto-generated each day. Switch to Manual mode to manage a custom queue.</p>
      </div>
      :<>
        <div className="fg g2 mb4">
          <input className="form-input" style={{flex:1}} placeholder="Add a topic for the queue…" value={newTopic}
            onChange={e=>setNewTopic(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTopic()}/>
          <button className="btn btn-p" onClick={addTopic}>Add</button>
        </div>
        {myTopics.length===0
          ?<div className="empty"><div className="empty-box">—</div><p className="empty-title">No topics yet</p><p className="empty-sub">Add topics above. Each day, the system picks the next unused one.</p></div>
          :myTopics.map((t,i)=>(
            <div key={t.id} className="li" style={{cursor:"default"}}>
              <span style={{color:"var(--fg3)",fontSize:13,width:20,textAlign:"center"}}>#{i+1}</span>
              <div className="li-content"><p style={{fontSize:13}}>{t.topic}</p></div>
              <div className="li-right">{t.used?<span className="badge b-gy">Used</span>:<span className="badge b-pu">Queued</span>}
                <button className="btn btn-g" style={{padding:4}} onClick={()=>delTopic(t.id)}>✕</button></div>
            </div>
          ))}
      </>
    )}

    {tab==="history"&&(myPosts.length===0
      ?<div className="empty"><div className="empty-box">—</div><p className="empty-title">No posts yet</p><p className="empty-sub">Posts appear here after your first automated publish.</p></div>
      :<div className="card">{myPosts.map(p=>(
        <div key={p.id} className="hist-item">
          <div className="hist-dot" style={{background:p.status==="posted"?"var(--success)":p.status==="failed"?"var(--danger)":"var(--warn)"}}/>
          <div style={{flex:1}}>
            <div className="fg aic g2 mb1"><PIcon p={p.platform}/><span style={{fontWeight:600,fontSize:13}}>{p.platform.charAt(0).toUpperCase()+p.platform.slice(1)}</span><StatusBadge status={p.status}/></div>
            <p className="txs tmut">{fmtDate(p.createdAt)}</p>
            {p.error&&<p className="txs tdan mt2">Error: {p.error}</p>}
            {p.url&&<a href={p.url} style={{fontSize:12,color:"var(--primary)"}}>View post →</a>}
          </div>
        </div>
      ))}</div>
    )}
    {confirmDel&&<Confirm title="Delete Schedule" msg={`"${s.name}" will be permanently deleted. This cannot be undone.`} onOk={del} onCancel={()=>setConfirmDel(false)}/>}
  </div>;
}

/* ══ HISTORY ══ */
function History({videos,setPage}){
  const [filter,setFilter]=useState("all");
  const filtered=filter==="all"?videos:videos.filter(v=>v.status===filter);
  return <div className="page">
    <div className="ph"><h1 className="pt">History</h1><p className="ps">All your generated reels</p></div>
    <div className="chips mb4">{[["all","All"],["ready","Ready"],["generating","Generating"],["failed","Failed"]].map(([val,label])=>(
      <span key={val} className={`chip ${filter===val?"sel":""}`} onClick={()=>setFilter(val)}>{label}</span>
    ))}</div>
    {filtered.length===0
      ?<div className="empty"><div className="empty-box">—</div><p className="empty-title">No reels found</p><p className="empty-sub">Create your first reel to see it here.</p><button className="btn btn-p" onClick={()=>setPage("create")}>Create Reel</button></div>
      :filtered.map(v=>{const g=GENRES.find(x=>x.id===v.genre);return(
        <div key={v.id} className="li" onClick={()=>setPage("video:"+v.id)}>
          <GIcon g={g}/>
          <div className="li-content"><div className="li-title">{v.title}</div><div className="li-sub">{g?.label} · {v.duration} · {fmtDate(v.createdAt)}</div></div>
          <div className="li-right"><StatusBadge status={v.status}/></div>
        </div>
      );})}
  </div>;
}

  return <div className="page">
    <div className="ph"><h1 className="pt">Usage</h1><p className="ps">Your plan usage this billing period</p></div>
    <div className="card-glow mb4">
      <div className="fg jb aic mb3">
        <div><p className="stat-label">Reels Used</p><p className="stat-val g">{used}<span style={{fontSize:16,fontFamily:"var(--font)",fontWeight:500,WebkitTextFillColor:"var(--fg2)"}}>/{profile.quota}</span></p></div>
        <span className="badge b-pu">Pro Plan</span>
      </div>
      <div className="prog mb2"><div className="prog-fill" style={{width:pct+"%"}}/></div>
      <p className="txs tmut">{pct}% used · Resets on June 1, 2026</p>
    </div>
    <div className="card-grid">
      <div className="stat-card"><div className="stat-label">Auto-posted</div><div className="stat-val" style={{color:"var(--primary)"}}>18</div><div className="stat-sub">via schedules</div></div>

      <div className="stat-card"><div className="stat-label">Accounts</div><div className="stat-val">1</div><div className="stat-sub">connected</div></div>
    </div>
    <h2 style={{fontFamily:"var(--font-display)",fontSize:15,fontWeight:700,marginBottom:14}}>Recent Activity</h2>
    {[["Reel generated","Today",6],["Automated post","Today",3],["Reel generated","This week",12]].map(([label,date,count],i)=>(
      <div key={i} className="fg aic g3" style={{padding:"12px 0",borderBottom:"1px solid var(--border)"}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:"var(--primary)",flexShrink:0}}/>
        <span style={{flex:1,fontSize:13}}>{label}</span>
        <span className="badge b-gy">×{count}</span>
        <span className="txs tmut">{date}</span>
      </div>
    ))}
  </div>;
}

/* ══ ACCOUNT ══ */
function AccountPage({profile,setProfile,onToast}){
  const [name,setName]=useState(profile.name);
  const [email,setEmail]=useState(profile.email);
  const [saving,setSaving]=useState(false);
  const [keys,setKeys]=useState({...profile.apiKeys});
  const [savingKeys,setSavingKeys]=useState(false);
  const [showKey,setShowKey]=useState({});

  const saveProfile=()=>{
    if(!name.trim()){onToast("Name cannot be empty","error");return;}
    if(!email.includes("@")){onToast("Enter a valid email","error");return;}
    setSaving(true);
    setTimeout(()=>{setProfile(p=>({...p,name,email}));setSaving(false);onToast("Profile updated","success");},700);
  };
  const saveKeys=()=>{
    setSavingKeys(true);
    setTimeout(()=>{setProfile(p=>({...p,apiKeys:{...keys}}));setSavingKeys(false);onToast("API keys saved","success");},700);
  };
  const KEY_LABELS={HEYGEN_API_KEY:"HeyGen API Key",ELEVENLABS_API_KEY:"ElevenLabs API Key",YOUTUBE_CLIENT_ID:"YouTube Client ID",TIKTOK_CLIENT_KEY:"TikTok Client Key",META_APP_ID:"Meta App ID"};

  return <div className="page">
    <div className="ph"><h1 className="pt">Account</h1><p className="ps">Manage your profile and subscription</p></div>
    <div className="card mb4">
      <div className="fg aic g3 mb4">
        <div className="av" style={{width:52,height:52,fontSize:18}}>{initials(profile.name)}</div>
        <div style={{flex:1}}><p style={{fontWeight:700,fontSize:15}}>{profile.name}</p><p className="tsm tmut">{profile.email}</p></div>
        <span className="badge b-pu">Pro</span>
      </div>
      <div className="divider" style={{margin:"0 0 16px"}}/>
      <div className="form-group"><label className="form-label">Display Name</label><input className="form-input" value={name} onChange={e=>setName(e.target.value)}/></div>
      <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
      <button className="btn btn-p btn-sm" onClick={saveProfile} disabled={saving}>{saving?<Spinner size={14}/>:"Save Changes"}</button>
    </div>

    <div className="card mb4">
      <h3 style={{fontWeight:700,marginBottom:14}}>Subscription</h3>
      <div className="fg jb aic" style={{padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
        <div><p style={{fontWeight:600}}>Pro Plan</p><p className="tsm tmut">$19/month · renews Jun 1, 2026</p></div>
        <span className="badge b-gr">Active</span>
      </div>
      <div className="fg g2 mt3">
        <button className="btn btn-o btn-sm" onClick={()=>onToast("Redirecting to billing portal…","info")}>Manage Billing</button>
        <button className="btn btn-d btn-sm" onClick={()=>onToast("To cancel, email support@reelgenai.com","info")}>Cancel Plan</button>
      </div>
    </div>

    <div className="card mb4">
      <h3 style={{fontWeight:700,marginBottom:4}}>API Keys</h3>
      <p className="tsm tmut mb4">Required for video generation and social publishing. Keys are stored encrypted.</p>
      {Object.entries(keys).map(([k,v])=>(
        <div key={k} className="form-group">
          <label className="form-label">{KEY_LABELS[k]||k}</label>
          <div className="fg g2">
            <input className="form-input" type={showKey[k]?"text":"password"}
              placeholder={v?"••••••••••":"Not set — enter key here"} value={v}
              onChange={e=>setKeys(prev=>({...prev,[k]:e.target.value}))}/>
            <button className="btn btn-o btn-sm" style={{flexShrink:0}} onClick={()=>setShowKey(p=>({...p,[k]:!p[k]}))}>
              {showKey[k]?"Hide":"Show"}</button>
          </div>
          {v&&<p className="form-hint tsuc">✓ Key is set</p>}
        </div>
      ))}
      <button className="btn btn-p btn-sm" onClick={saveKeys} disabled={savingKeys}>{savingKeys?<Spinner size={14}/>:"Save Keys"}</button>
    </div>

    <div className="card" style={{border:"1px solid rgba(239,68,68,0.25)"}}>
      <h3 style={{fontWeight:700,marginBottom:6,color:"#fca5a5"}}>Danger Zone</h3>
      <p className="tsm tmut mb3">Deleting your account is permanent and cannot be undone.</p>
      <button className="btn btn-d btn-sm" onClick={()=>onToast("Contact support@reelgenai.com to delete your account","info")}>Delete Account</button>
    </div>
  </div>;
}

/* ══ ROOT ══ */
function App(){
  const [authed,setAuthed]=useState(false);
  const [page,setPage]=useState("dashboard");
  const [toast,setToast]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [schedules,setSchedules]=useState(INIT_SCHEDULES);
  const [videos,setVideos]=useState(INIT_VIDEOS);
  const [connections]=useState(INIT_CONNECTIONS);
  const [topics,setTopics]=useState(INIT_TOPICS);
  const [posts]=useState(INIT_POSTS);
  const [profile,setProfile]=useState(INIT_PROFILE);

  const toast$=(msg,type="success")=>setToast({msg,type});

  /* Simulate generating videos finishing after 10s */
  useEffect(()=>{
    if(!videos.some(v=>v.status==="generating")) return;
    const t=setTimeout(()=>setVideos(prev=>prev.map(v=>v.status==="generating"?{...v,status:"ready",script:SAMPLE_SCRIPT}:v)),10000);
    return()=>clearTimeout(t);
  },[]);

  const TITLES={dashboard:"Dashboard",create:"Create Reel",automation:"Automation","automation-new":"New Schedule",history:"History",usage:"Usage",account:"Account",pricing:"Pricing"};
  const isDetail=page.startsWith("automation-detail:");
  const isVideo =page.startsWith("video:");
  const detailId=isDetail?page.split(":")[1]:null;
  const videoId =isVideo ?page.split(":")[1]:null;
  const title=isDetail?"Schedule Detail":isVideo?"Reel Detail":(TITLES[page]||"ReelGenAi");

  if(!authed) return <><GlobalStyle/><AuthPage onLogin={()=>setAuthed(true)}/></>;

  return <>
    <GlobalStyle/>
    <div className="app">
      <div className="app-body">
        <Sidebar page={page} setPage={p=>{setPage(p);setSidebarOpen(false);}} onLogout={()=>setAuthed(false)} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
        <div className="main">
          <div className="topbar">
            <div className="topbar-left">
              <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}>☰</button>
              <span className="topbar-title">{title}</span>
            </div>
            <div className="topbar-right">
              <span className="badge b-pu">Pro</span>
              <div className="av" style={{width:34,height:34,fontSize:13}}>{initials(profile.name)}</div>
            </div>
          </div>
          {page==="dashboard"      &&<Dashboard   videos={videos} profile={profile} setPage={setPage}/>}
          {page==="create"         &&<CreateReel  onToast={toast$} setVideos={setVideos} setPage={setPage}/>}
          {page==="automation"     &&<AutomationPage schedules={schedules} setSchedules={setSchedules} connections={connections} setPage={setPage} onToast={toast$}/>}
          {page==="automation-new" &&<NewSchedule setSchedules={setSchedules} onToast={toast$} setPage={setPage}/>}
          {isDetail                &&<ScheduleDetail scheduleId={detailId} schedules={schedules} setSchedules={setSchedules} posts={posts} topics={topics} setTopics={setTopics} onToast={toast$} setPage={setPage}/>}
          {page==="history"        &&<History     videos={videos} setPage={setPage}/>}
          {isVideo                 &&<VideoDetail videoId={videoId} videos={videos} setPage={setPage} onToast={toast$}/>}
          {page==="usage"          &&<UsagePage   profile={profile}/>}
          {page==="pricing"        &&<PricingPage onToast={toast$}/>}
          {page==="account"        &&<AccountPage profile={profile} setProfile={setProfile} onToast={toast$}/>}
        </div>
      </div>
    </div>
    {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
  </>;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
